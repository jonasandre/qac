name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p packages/core
      - run: bunx tsc --noEmit -p packages/cli
      - run: bunx tsc --noEmit -p packages/mcp
      - run: bun test
