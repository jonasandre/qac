name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Compile binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          ENTRY="packages/cli/src/index.ts"
          for target in linux-x64 linux-x64-musl linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            out="dist/qac-${target}"
            if [ "$target" = "windows-x64" ]; then out="${out}.exe"; fi
            echo "Building ${out}..."
            bun build "$ENTRY" --compile --target="bun-${target}" --outfile "$out"
          done
          ls -lh dist/

      - name: Create checksums
        working-directory: dist
        run: shasum -a 256 qac-* > SHA256SUMS

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
