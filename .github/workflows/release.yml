name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Compile binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          ENTRY="packages/cli/src/index.ts"
          for target in linux-x64 linux-x64-musl linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            out="dist/qac-${target}"
            if [ "$target" = "windows-x64" ]; then out="${out}.exe"; fi
            echo "Building ${out}..."
            bun build "$ENTRY" --compile --target="bun-${target}" --outfile "$out"
          done
          ls -lh dist/

      - name: Create checksums
        working-directory: dist
        run: shasum -a 256 qac-* > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
